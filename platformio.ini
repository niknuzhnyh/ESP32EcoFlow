[platformio]
default_envs = esp32-devkit-v1

[env:esp32-devkit-v1]
platform = espressif32
board = esp32doit-devkit-v1
framework = arduino

board_build.partitions = partitions_4MB.csv
board_upload.flash_size = 4MB

build_flags =
    -DCORE_DEBUG_LEVEL=3

lib_deps =
    bblanchon/ArduinoJson @ ^7.0.4

monitor_speed = 115200
upload_speed = 921600
upload_port = COM5
monitor_port = COM5
